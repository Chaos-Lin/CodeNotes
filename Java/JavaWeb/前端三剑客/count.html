<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
	<div id="app">

		<input type="button" value="-" @click="minus(number)">
		<span>{{number}}</span>
		<input type="button" value="+" @click="plus(number)">

	</div>

</body>
<script>
	new Vue({
		el: '#app',
		data: {
			number: "0"
		},
		methods: {
			minus: function () {
				console.log('add')
				this.number--;
			},
			plus: function (number) {
				console.log('sub')
				this.number++;
			}

		}

	})
</script>

</html>
