<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetApp</title>
  <!-- <script src="https://unpakg.com/axios/dist/axios.min.js"></script> -->
  <script src="axios.js"></script>
</head>

<body>
  <input type="button" value="get" class="get">
  <input type="button" value="post" class="post">
</body>
<script>
  /*
    接口1:随机笑话
    请求地址:https://autumnfish.cn/api/joke/list
    请求方法:get
    请求参数:num(笑话条数,数字)
    响应内容:随机笑话
*/
  document.querySelector(".get").onclick = function () {
    axios.get("https://autumnfish.cn/api/joke/list?num=3").then(function (response) {
      console.log(response);
    }, function (err) {
      console.log(err)
    })
    // then的参数是两个函数，分别用于返回正确值和错误值
  }
  // 通过querySelector获取到get类，并绑定一个onclick事件的函数


  /*
    接口2:用户注册
    请求地址:https://autumnfish.cn/api/user/reg
    请求方法:post
    请求参数:username(用户名,字符串)
    响应内容:注册成功或失败
  */
  document.querySelector(".post").onclick = function () {
    axios.post("https://autumnfish.cn/api/user/reg", { username: "jack" }).then(function (response) {
      console.log(response);
    }, function (err) {
      console.log(err);
    })
  }
</script>

</html>
